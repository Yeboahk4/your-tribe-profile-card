<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FDND Visitekaartje</title>
    <link rel="stylesheet" href="styles/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  </head>
  <body>
    
    <article>
      
      <header>
        
        <h1>Kennie Yeboah</h1>
        
        <p class="slogan"><em>Frontend Developer in development!</em></p>
        
        <button>
          <svg width="24" height="24" viewBox="0 0 24 24" stroke-width="1.5" stroke="#2c3e50" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <title>Wijzig layout</title>
            <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
            <path d="M4 8v-2a2 2 0 0 1 2 -2h2"></path>
            <path d="M4 16v2a2 2 0 0 0 2 2h2"></path>
            <path d="M16 4h2a2 2 0 0 1 2 2v2"></path>
            <path d="M16 20h2a2 2 0 0 0 2 -2v-2"></path>
          </svg>
          <svg width="24" height="24" viewBox="0 0 24 24" stroke-width="1.5" stroke="red" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
            <path d="M15 19v-2a2 2 0 0 1 2 -2h2"></path>
            <path d="M15 5v2a2 2 0 0 0 2 2h2"></path>
            <path d="M5 15h2a2 2 0 0 1 2 2v2"></path>
            <path d="M5 9h2a2 2 0 0 0 2 -2v-2"></path>
          </svg>
        </button>
        
      </header>
  
      <img src="assets/IMG_2.png" alt="Plaatje van mijzelf" width="800" height="800">
      
      <!--  Hierin heb ik een lijst waarin mijn "Badges" naast elkaar komen te staan. Elk hebben een specifieke class met een eigen style     -->

      <ul class="tracks-row">
        <li class="track track-left">
          <span class="badge badge-afrobeats">Afrobeats</span>
          <p>Rema - Charm</p>
        </li>

        <li class="track track-center">
          <span class="badge badge-rnb">R&B</span>
          <p>SZA - The Weekend</p>
          
        </li>

        <li class="track track-right">
          <span class="badge badge-afropiano">Afropiano</span>
          <p>Asake - Remember</p>
        </li>
      </ul>


  
      <p><br>Kennie — developer, muziekliefhebber en altijd bezig met het bouwen van dingen die goed voelen en er goed uitzien.</p>
      
    </article>

    <script src="scripts/script.js"></script>
    
  </body>
</html>
